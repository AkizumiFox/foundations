- key: def-box-rn
  kind: def
  file: 01-points-and-coordinates.md
  line: 106
  hash: 555c363f59d1
  verdicts:
  - stage: S5a
    verdict: minor
    by: A:09/01
    hash: 555c363f59d1
    date: '2026-11-01'
    evidence: 'Line 129 says ''That one change makes T no box'', and line 129 ends ''To show a set is
      not a box...''. The proof only rules out T = [p1,q1]x[p2,q2], a closed box, but def-box-rn also
      defines open boxes. Line 123 gives the non-example {x in R^2 : 1 <= x_1 <= 0}, which bounds only
      x_1, so it does not have the form of a box. The rest checks out: the corners lie in the box by reflexivity,
      and the center lies in the open box by fd3:prp-ordered-field-halves (b), which says this for a<b.
      a=b gives one point by antisymmetry and tuple equality, which the text leaves silent but is trivial.'
  - stage: S5b
    verdict: gap
    by: B:09/01
    hash: 555c363f59d1
    date: '2026-11-01'
    evidence: 'Line 129: ''That one change makes T no box'' covers both kinds of box in def-box-rn, but
      the proof only assumes T = [p1,q1] x [p2,q2], so it rules out closed boxes only; the open-box case
      is never argued. Line 123''s empty ''box'' {x in R^2 : 1 <= x_1 <= 0} has no bound on x_2, so it
      is not of box form even formally. The pointer to Sets and Functions Section 4.2 (fd2 ch04/02:266)
      and to Section 1.4 (pair/interval convention) both check out.'
  - stage: S7r
    verdict: correct
    by: rereferee
    hash: 555c363f59d1
    date: '2026-11-01'
    evidence: '01:123: the degenerate [1,0]x[0,1] is in box form. 01:129: the closed case is unchanged
      and correct. The open case, from (0,0) and (1,1), gives p_i<0 and q_i>1, so (0,1) is in the box
      and not in T. That covers both kinds of box in def-box-rn. The ledger line now says ''closed or
      open box''. verify/ch09/exr-points-and-coordinates-b2.py passes, including the new open-box loop.'
