    date: '2026-11-01'
    evidence: '01-points-and-coordinates.md:29 cites @fd2:def-ordered-pair for equality of n-tuples, but
      that definition covers pairs only; the n-tuple rule is in fd2 1.4''s ''Longer lists'' paragraph
      (fd2/src/ch01-sets/04-products-and-relations.md:70). The mathematics is correct: X^n with X=R matches
      fd2:def-cartesian-product:95, the R^1 convention is consistent, and the gluing map is a bijection
      by the n-tuple equality rule.'
  - stage: S5b
    verdict: minor
    by: B:09/01
    hash: 58e97d1f2762
    date: '2026-11-01'
    evidence: 'Lines 15-58: the mathematics checks out. fd2 defines n-tuples only for n >= 2 (fd2 01 sec04:70),
      C := R^2 is in def-complex-numbers (fd4 ch03/01:19), and the gluing bijection is correct, including
      the case m=1 or n=1. Two minor problems. Line 29 credits the equality of n-tuples to @fd2:def-ordered-pair,
      but that definition covers pairs only; the n-tuple rule is in the unlabelled ''Longer lists'' paragraph.
      Also, NOTATION.md still has no R^n row, although blueprint sec.3 planned one.'
  - stage: S8
    verdict: minor
    by: S8:09
    hash: 58e97d1f2762
    date: '2026-11-01'
    evidence: NOTATION.md has no rows for R^n, R^1:=R, e_k, x⊥y, d(x,y) or proj_y x, although blueprint
      merged-ch09-f48.md:77 and :302 say they were added
  - stage: S7r
    verdict: minor
    by: rereferee
    hash: 58e97d1f2762
    date: '2026-11-01'
    evidence: The text is now correct. 01:29 cites *Sets and Functions* Section 1.4 for the n-tuple equality
      (fd2 04-products-and-relations.md:70) and @fd2:def-ordered-pair for pairs. The only open problem
      is the S8 one, that NOTATION.md has no R^n or R^1:=R row. That is in a shared file and is deferred,
      not a fault in the section text.
