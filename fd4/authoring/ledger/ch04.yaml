- key: proof:lem-finite-sums-and-powers
  kind: proof
  file: 01-polynomials-as-sequences.md
  line: 147
  hash: f717c0cd6b64
  verdicts:
  - stage: S5a
    verdict: correct
    by: refereeA
    hash: e29506f780d1
    date: '2026-10-12'
    model: claude-opus-5-5
    evidence: '01:148-156. (a): fd2:thm-recursion with g(j,y)=y+u_j; Σ_0 = S_1 = 0+u_0 = u_0 uses the
      0+u=u hypothesis; uniqueness and dependence on u_0..u_k go through by induction (j+1<=k+1 gives
      j<=k). Products are handled the same way. (c): fd3:thm-omega-arithmetic-laws (c) is associativity,
      giving m+(n+1)=(m+n)+1; (d),(e) give m(n+1)=mn+m; (F5),(F6),(F7) are used correctly against fd3
      03-ordered-rings.md:17'
  - stage: S5b
    verdict: minor
    by: refereeB
    hash: e29506f780d1
    date: '2026-10-12'
    model: claude-opus-5-5
    evidence: 01-polynomials-as-sequences.md:156 The base case '(s^m)^0 = 1 = s^0 = s^{m*0}' uses m*0
      = 0 without a citation, and the ledger's source for it is wrong.
  - stage: S7r
    verdict: minor
    by: rereferee
    hash: f717c0cd6b64
    date: '2026-10-12'
    model: claude-opus-5-5
    evidence: ')+1 is @fd3:thm-omega-arithmetic-laws (c), associativity; m(n+1) = mn + m is (d) plus n*1
      = n from (e). One small gap remains. The idea box at 01:144 says ''Only the laws of R named at each
      step are used'', and the first law''s base case names (F7). But the third law''s base case at 01:156,
      ''(st)^0 = 1 = 1 * 1 = s^0 t^0'', uses 1 * 1 = 1, which is (F7), without naming it. Fix: add ''(F7)''
      after ''1 * 1''.'
  - stage: S7r
    verdict: correct
    by: rereferee
    hash: 1d7387c8c6c4
    date: '2026-10-12'
    model: claude-opus-5-5
    evidence: '-laws (c), the recursion, the hypothesis and (F5). Second law: the base case uses def-omega-arithmetic
      (b), m·0 = 0. The step uses the first law and m(n+1) = mn+m from laws (d), (e). Third law: the base
      case is 1 = 1·1 by (F7), now named. The step regroups (s^n t^n)(st) = (s^n s)(t^n t) using (F5)
      and (F6), which is valid because R is commutative. Every law used is named, as the idea box promises.'
