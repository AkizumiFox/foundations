- key: def-function-algebra
  kind: def
  file: 01-real-functions-and-graphs.md
  line: 129
  hash: 74ef686f787b
  verdicts:
  - stage: S5a
    verdict: minor
    by: A:08/01
    hash: b6e6d2c87009
    date: '2026-11-01'
    evidence: 01:136 uses max(f(x),g(x)) for reals with no source; fd3 ch04 01-rules-and-absolute-value.md:320
      defines max{a,b} (braces) in an ordered field; not cited, not in ledger, notation differs. Associativity
      paragraph and second-reading fold (01:142-146) are correct via fd2:prp-function-equality
  - stage: S5b
    verdict: minor
    by: B:08/01
    hash: b6e6d2c87009
    date: '2026-11-01'
    evidence: L132-139 defines f+g, fg, cf, |f|, max, min, f/g and g∘f, but not f−g or −f. Those appear
      in prp-graph-transformations (c) at L214, the uniqueness proof (e−e', L309) and B1 (|f−g|, L357).
      The L148 empty-domain claim needs −x²−1<0, which has no ledger line.
  - stage: S7r
    verdict: correct
    by: rereferee
    hash: 74ef686f787b
    date: '2026-11-01'
    evidence: '01:136 defines max(a,b) and min(a,b) inline, with the same case rule as fd3 exr C2. It
      defines -f := (-1)f, which is legal as cf with c = -1, and f-g on D_f ∩ D_g. The instance at 01:142,
      |f| = max(f,-f), checks out in both sign cases: when f(x) = 0 the rule gives b = -0 = 0. The empty-domain
      sentence now gives x^2 >= 0, so -x^2-1 <= -1 < 0. The new ledger rows cite labels that exist (fd3:prp-ordered-ring-rules,
      fd3:def-absolute-value-ordered-field, fd3:exr-rules-and-absolute-value-c2).'
  - stage: S7r
    verdict: correct
    by: rereferee
    hash: 74ef686f787b
    date: '2026-11-01'
    evidence: max/min are defined by cases; -f := (-1)f; f - g := f + (-g) on D_f ∩ D_g; composite domain
      unchanged. The follow-up |f| = max(f, -f) is checked in both cases.
