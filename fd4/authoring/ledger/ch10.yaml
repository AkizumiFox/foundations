  - stage: S5a
    verdict: correct
    by: A:10/01
    hash: 567867d1853a
    date: '2026-11-01'
    evidence: 'lines 57-67: (<=) p'' + ((t-s)/λ)λv = p + sv + (t-s)v = p + tv, and the division needs
      λ≠0. (=>) v'' = (u-s)v, and u-s=0 would force v''=0, which contradicts the hypothesis v''≠0. The
      cited laws (e),(h),(i) are correct, and the remaining field steps are in the ledger at line 455.'
  - stage: S5b
    verdict: correct
    by: B:10/01
    hash: 567867d1853a
    date: '2026-11-01'
    evidence: '01:56-72: both inclusions checked. In (=>), v''=(u-s)v and u-s≠0 by (i). The ledger covers
      the field division.'
