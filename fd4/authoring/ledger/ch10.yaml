    date: '2026-11-01'
    evidence: 'line 11-23: the definition is correct. The first numeric instance, (1,0,0)+R(-1,1,0), comes
      only after it at line 23, and line 7 is a description in words. Under STYLE §13 B5 a definition
      that introduces p, v, the parametrization and the parameter needs a worked instance before it.'
