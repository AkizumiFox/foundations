    verdict: minor
    by: B:10/01
    hash: 38a6e975bb1e
    date: '2026-11-01'
    evidence: '01:11-23 definition correct. Two problems: the first worked instance with numbers, (1,0,0)+R(-1,1,0),
      comes after the definition (line 23), not before it as STYLE §13 B5 asks. Also, the new notation
      p + Rv and its shorthand Rv (used bare in B3 and B4(c)) has no row in NOTATION.md.'
