      (b) applies. In Case 1, f(i)<=n follows by (e). In Case 2, sigma is injective and misses j; g=f∘sigma
      avoids n+1, and P(n) is applied at m-1. The idea's 'move pigeon j to the hole of pigeon m' matches
      g(j)=f(m). The school order facts are in the ledger (:531-532). The sidecar thm-pigeonhole.py
