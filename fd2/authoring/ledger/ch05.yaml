  kind: check
  file: 01-chains-and-zorn.md
  line: 191
  hash: 56aca86433c0
  verdicts:
  - stage: S5a
    verdict: minor
    by: refereeA
    hash: d43e0057eaaf
    date: '2026-10-25'
    model: claude-opus-5-5
    evidence: 01-chains-and-zorn.md:196 The 'exactly the maximal elements' argument rules out one-element
      sets but not ∅.
  - stage: S5b
    verdict: minor
    by: refereeB
    hash: d43e0057eaaf
    date: '2026-10-25'
    model: claude-opus-5-5
    evidence: 01-chains-and-zorn.md:196 Parity facts used without @ref and missing from the dependency
      ledger.
  - stage: S7r
    verdict: correct
    by: rereferee
    hash: a921f153e3e0
    date: '2026-10-25'
    model: claude-opus-5-5
    evidence: 'Recomputed: a partial object (a set of pairwise unrelated integers) holds at most one even
      and one odd integer, because same-parity differences are even. The two-element ones are {e,o}. Those
      are maximal: by thm-even-or-odd a third integer has the parity of e or o. ∅ and singletons sit strictly
      inside some {e,o}. {0,1} and {4,-7} are valid examples.'
  - stage: S7r
    verdict: minor
    by: rereferee
    hash: a921f153e3e0
    date: '2026-10-25'
    model: claude-opus-5-5
    evidence: 'The solution never shows that {e,o} is itself a partial object, i.e. that e ≁ o (e − o
      is odd, so not even, which needs ''not both even and odd''). It only shows at most one element of
      each parity. Everything else is right: the maximal elements are the {e,o}, and ∅ and the singletons
      lie strictly inside some {e,o}.'
  - stage: S8
    verdict: correct
    by: coordinator
    hash: 56aca86433c0
    date: '2026-10-25'
    evidence: '01:196 added: {e,o} is a partial object, e-o=2(a-b-1)+1 odd hence not even (thm-even-or-odd,
      ch01/01:139), so e !~ o; rest (at most one per parity, maximality, no greatest) rechecked'
