- key: thm-gluing
  kind: thm
  file: 01-restriction-extension-and-gluing.md
  line: 91
  hash: 279d737754d0
  verdicts:
  - stage: S5a
    verdict: minor
    by: refereeA
    hash: 68a0f789ab8c
    date: '2026-10-26'
    model: claude-opus-5-5
    evidence: 01-restriction-extension-and-gluing.md:94 The statement gives the f_i one at a time ('for
      each i ∈ I let f_i be a function'), but the proof forms G := ⋃_i G_i with def-family-union-intersection.
      That definition needs i ↦ G_i to be a family, that is, a function I → P(X×Y) (Section 1.5 makes
      families functions). For infinite I, choosing an f_i for each i separately is not a construction
      the book all
  - stage: S5b
    verdict: minor
    by: refereeB
    hash: 68a0f789ab8c
    date: '2026-10-26'
    model: claude-opus-5-5
    evidence: '01-restriction-extension-and-gluing.md:113 ''Each hypothesis has one job'' is false: the
      cover is used twice.'
  - stage: S7r
    verdict: correct
    by: rereferee
    hash: 279d737754d0
    date: '2026-10-26'
    model: claude-opus-5-5
    evidence: 'L94: the hypothesis is now a family (f_i)_{i in I}, so the proof''s union G := ⋃ G_i is
      legitimate. L113 limits ''one job'' to the existence part, which matches the proof.'
  - stage: S7r
    verdict: correct
    by: rereferee
    hash: 279d737754d0
    date: '2026-10-26'
    model: claude-opus-5-5
    evidence: Statement now uses a family (f_i)_{i in I}. The Idea scopes 'one job' to existence. Hypotheses
      and conclusion are unchanged and sound.
