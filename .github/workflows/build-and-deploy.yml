# Builds every volume on every push to main and checks it. It does not publish.
name: Build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install TeX Live, poppler, aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-pictures texlive-fonts-extra \
            lmodern poppler-utils aspell aspell-en

      - name: Install Pandoc 3.1.3
        run: |
          curl -sSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          sudo dpkg -i pandoc.deb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python packages
        run: pip install pyyaml sympy

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache MathJax
        uses: actions/cache@v4
        with:
          path: ~/.cache/book-engine
          key: book-engine-mathjax-3.2.2

      - name: Engine tests
        run: python -m unittest discover -s engine/tests

      - name: Book tool tests
        run: python -m unittest discover -s tests

      - name: Build and check fd1
        working-directory: fd1
        run: |
          ./build.py all
          ./build.py check

      - name: Build and check fd2
        working-directory: fd2
        run: |
          ./build.py all
          ./build.py check

      - name: Build and check fd3
        working-directory: fd3
        run: |
          ./build.py all
          ./build.py check
