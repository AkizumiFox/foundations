    date: '2026-10-19'
    model: claude-opus-5-5
    evidence: 01-formulas-and-parse-trees.md:251 def-parse-tree gives only the building clauses T1-T3
      and no closing clause, yet Section 4.3 uses 'every parse tree arises from T1-T3' to prove uniqueness.
  - stage: S5b
    verdict: gap
    by: refereeB
    hash: 0bcf1d24030d
    date: '2026-10-19'
    model: claude-opus-5-5
    evidence: 01-formulas-and-parse-trees.md:251 def-parse-tree has no closing clause, so nothing excludes
      trees not produced by (T1)-(T3). 4.3's proof that every formula has exactly one parse tree depends
      on such a clause.
  - stage: S7r
    verdict: correct
    by: rereferee
    hash: e3accb71e037
    date: '2026-10-19'
    model: claude-opus-5-5
    evidence: '01:255 adds (T4): a tree is a parse tree for phi only if that follows from finitely many
      uses of (T1)-(T3). Its ''in particular'' holds. A tree for neg-phi cannot come last from (T1), since
      neg-phi is not an atom or bot, or from (T3), since neg-phi does not begin with ''(''. So it comes
      from (T2). A tree for (phi o psi) likewise comes from (T3). The sentence does not claim the parts
      are phi and psi, a'
