    evidence: 'S8 seam (authoring/reviews/ch03-S8-seam.md): cross-section, cross-chapter labels and notation
      checked'
  - stage: S5a
    verdict: correct
    by: refereeA
    hash: fadb99e2bcd1
    date: '2026-10-19'
    model: claude-opus-5-5
    evidence: 'l.114-125: F1-F4 well formed. The two facts at l.136-138 and the first-symbol test at l.142-144
      follow from the prefix-closure of formation sequences. The ''smallest collection'' gloss at l.222
      is proved in 4.3 l.101-110.'
  - stage: S5b
    verdict: gap
    by: refereeB
    hash: fadb99e2bcd1
    date: '2026-10-19'
    model: claude-opus-5-5
    evidence: 01-formulas-and-parse-trees.md:136 The argument for 'every entry of a formation sequence
      is a formula' is circular. It shows that chi_i is the last entry of a formation sequence, which
      makes chi_i a formula only if every such last entry is a formula, and that is the claim being proved.
      (F4) gives only 'formula => last entry'.
  - stage: S7r
    verdict: correct
    by: rereferee
    hash: fadb99e2bcd1
    date: '2026-10-19'
    model: claude-opus-5-5
    evidence: 01:136. The first fact is now argued forward along the list. chi_1 is an atom or bot, so
      it is a formula by (F1). Each later entry is an atom or bot, or is built by (F2)/(F3) from earlier
      entries that are already formulas. That is an informal induction on position. It is not circular,
      because it no longer uses (F4) in the wrong direction. It points to the 4.3 fold "Sets built from
      a base" (03:102)
