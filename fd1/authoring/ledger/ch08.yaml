    evidence: 'Lines 235-241. (⇒): multiply x<=1 by x>=0. (⇐): split into x=0 or x>0, then divide by x>0.
      Both are correct. The remark now gives its reason: for x<0, x^2>=0>x, so x^2<=x forces x>=0. That
      is correct, and the ledger entry is at :473. The counterexample x=-1 for (⇒) is correct. The finding
      is resolved.'
